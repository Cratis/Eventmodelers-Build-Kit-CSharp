name: Publish

# Merged pull requests queue in one group so every release runs in order; closes of unmerged pull requests
# get their own group and never hold the release queue (Cratis/Workflows#162).
concurrency:
  group: ${{ (github.event_name != 'pull_request' || github.event.pull_request.merged == true) && format('publish-{0}', github.repository) || format('publish-unmerged-{0}', github.run_id) }}
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'scripts/**'
      - 'package.json'
      - '.cratis/ai.json'
      - '.github/workflows/publish.yml'

permissions:
  issues: write
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}
