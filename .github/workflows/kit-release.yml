name: Kit release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
      release-notes:
        type: string
        required: false
        default: ''
    secrets:
      commit-token:
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ inputs.version }}
          release-notes: ${{ inputs.release-notes }}

  corpus:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.commit-token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Cratis CLI
        run: dotnet tool install -g Cratis.Cli

      - name: Check out the corpus
        uses: actions/checkout@v4
        with:
          repository: Cratis/AI
          path: .corpus

      - name: Update the AI corpus
        run: cratis ai update --source .corpus --force

      - name: Sync the corpus into templates
        run: node scripts/sync-corpus-to-templates.mjs

      - name: Commit back
        run: |
          git config user.name  'cratis-bot'
          git config user.email 'bot@cratis.io'
          git add -A .cratis templates
          git diff --staged --quiet && { echo 'Corpus already up to date.'; exit 0; }
          git commit -m 'chore: update Cratis AI corpus [skip ci]'
          git push origin main
