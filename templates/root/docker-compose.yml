services:
  chronicle:
    image: cratis/chronicle:latest-development
    pull_policy: always
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    ports:
      - 127.0.0.1:27017:27017
      - 127.0.0.1:8080:8080
      - 127.0.0.1:11111:11111
      - 127.0.0.1:30000:30000
      - 127.0.0.1:35000:35000

  # The dashboard allows anonymous access, so it is published on localhost only.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://chronicle:18889
      - ALLOW_UNSECURED_TRANSPORT=true
      - DOTNET_ENVIRONMENT=Development
    ports:
      - 127.0.0.1:18888:18888
      - 127.0.0.1:4317:18889